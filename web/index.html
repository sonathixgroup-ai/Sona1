<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!--
    Dreamflow share links may serve the `web/` folder without running `flutter build web`,
    meaning `$FLUTTER_BASE_HREF` might not be replaced.
    If that placeholder remains, relative URLs (including `main.dart.js`) resolve incorrectly
    and the app stays stuck on the initial Flutter loading spinner.

    Using a relative base makes the app work both at root and under sub-paths.
  -->
  <!--
    NOTE (Dreamflow preview/share): the Flutter tool may rewrite <base href> to
    "./" when running on the "web-server" device, but the Flutter runtime
    requires an absolute base (starting with "/").

    The safest option here is to OMIT the <base> tag entirely.
    - Preview/share links: work from the current document URL
    - Production builds: `flutter build web --base-href ...` will generate a
      correct `index.html` in build/web.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Application officielle de THIX ID.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="THIX ID">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>THIX ID</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Required by the `flutter-passkeys` web plugin (Corbado). Without this, the app throws
       "Passkeys Web SDK not loaded" at runtime even if the feature isn't used directly. -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js" defer></script>

  <!--
    IMPORTANT:
    This project previously referenced `flutter_bootstrap.js`, but the file is not present in
    `web/` (and therefore not served in Dreamflow share links), which leaves the app stuck on
    the initial loading spinner.

    Loading `main.dart.js` directly is the most robust option for Dreamflow preview + share.
  -->
  <script src="main.dart.js" defer></script>
</body>
</html>
