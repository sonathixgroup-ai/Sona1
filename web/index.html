<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="THIX ID CENTRAL - Une identité Vérifiée, avenir de confiance.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="THIX ID CENTRAL">
  <meta name="theme-color" content="#0B3D91">

  <meta property="og:title" content="THIX ID CENTRAL">
  <meta property="og:description" content="Une identité Vérifiée, avenir de confiance">
  <meta property="og:type" content="website">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <title>THIX ID CENTRAL</title>

  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#0B3D91; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow:hidden; }
    #thix-loader {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#0B3D91;
      color:white; z-index:9999; transition:opacity .45s ease;
    }
    #thix-loader.hidden { opacity:0; pointer-events:none; }
    .logo-wrap { width:340px; max-width:88vw; display:flex; justify-content:center; filter: drop-shadow(0 10px 28px rgba(0,0,0,.35)); }
    .logo-wrap img { width:100%; height:auto; display:block; }
    .baseline {
      margin-top:26px; text-align:center; line-height:1.3;
      font-size:15px; font-weight:800; letter-spacing:.5px; color:#F7C948; text-transform:uppercase;
    }
    .baseline span {
      display:block; margin-top:6px; font-size:12.5px; font-weight:500;
      letter-spacing:.3px; color:rgba(255,255,255,.92); text-transform:none;
    }
    .spinner {
      margin-top:30px; width:30px; height:30px;
      border:3px solid rgba(255,255,255,.25); border-top-color:#F7C948;
      border-radius:50%; animation:spin .9s linear infinite;
    }
    .footer {
      position:absolute; bottom:28px; left:0; right:0; text-align:center;
      font-size:11px; font-weight:700; letter-spacing:1.4px;
      color:rgba(255,255,255,.55); text-transform:uppercase;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <!-- SPLASH NATIF - Bleu #0B3D91 -->
  <div id="thix-loader">
    <div class="logo-wrap">
      <img src="icons/thix-logo-transparent.png" alt="THIX ID CENTRAL" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block'">
      <div id="fallback-title" style="display:none; font-size:28px; font-weight:900; letter-spacing:1px;">THIX ID CENTRAL</div>
    </div>

    <div class="baseline">
      Une identité Vérifiée
      <span>avenir de confiance</span>
    </div>

    <div class="spinner"></div>
    <div class="footer">By Sonathix Group</div>
  </div>

  <!-- Passkeys CDN fiable -->
  <script src="https://cdn.jsdelivr.net/gh/corbado/flutter-passkeys@2.4.0/bundle.js" async></script>

  <script>
    (function() {
      var loader = document.getElementById('thix-loader');
      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function(){ if(loader && loader.parentNode) loader.remove(); }, 500);
        }
      }
      // 1. Quand Flutter rend la 1ère frame
      window.addEventListener('flutter-first-frame', hideLoader);
      // 2. FIX écran blanc : force hide après 2.5s même si Flutter n'a pas envoyé l'event
      setTimeout(hideLoader, 2500);
      // 3. Sécurité : si page reste bloquée 8s, affiche bouton
      setTimeout(function(){
        if (!hidden && loader) {
          var btn = document.createElement('div');
          btn.innerHTML = '<div style="margin-top:18px;font-size:12px;opacity:.85">Chargement lent...<br><button onclick="location.reload()" style="margin-top:10px;padding:8px 18px;border-radius:20px;border:0;background:#F7C948;color:#0B3D91;font-weight:800;">Réessayer</button></div>';
          loader.appendChild(btn);
        }
      }, 8000);
    })();
  </script>

  <!-- Flutter bootstrap officiel - active Service Worker + cache -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
