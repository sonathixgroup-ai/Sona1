<!DOCTYPE html>
<html lang="fr">
<head>

  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta
      name="description"
      content="Application officielle THIX ID">

  <!-- Anti-cache -->
  <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">

  <meta http-equiv="Pragma"
        content="no-cache">

  <meta http-equiv="Expires"
        content="0">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0A0A0A">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="THIX ID">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>THIX ID</title>

</head>

<body>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #loading {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .loader {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid #e5e5e5;
      border-top-color: #F7B500;
      animation: spin 1s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <div id="loading">
    <div class="loader"></div>
    <div>Chargement sécurisé...</div>
  </div>

  <!-- Passkeys -->
  <script
      src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js">
  </script>

  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loading = document.getElementById("loading");
      if (loading) {
        loading.remove();
      }
    });

    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        window.location.reload();
      }
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        if (!window.flutter) {
          window.location.reload();
        }
      }
    });
  </script>

</body>
</html>
