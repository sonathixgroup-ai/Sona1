<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="THIX ID CENTRAL - Une identité Vérifiée, avenir de confiance">
  <meta name="theme-color" content="#0B3D91">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/Icon-192.png">
  <title>THIX ID CENTRAL</title>
  <style>
    body{margin:0;background:#0B3D91;font-family:system-ui}
    #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B3D91;z-index:9999;transition:opacity .4s}
    #loader.hidden{opacity:0;pointer-events:none}
    .title{font-size:32px;font-weight:900;color:#fff;letter-spacing:1px;text-align:center}
    .sub{margin-top:18px;color:#F7C948;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
    .sub2{color:rgba(255,255,255,.9);font-weight:500;text-transform:none;margin-top:4px}
    .spin{margin-top:28px;width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#F7C948;border-radius:50%;animation:spin .9s linear infinite}
    .foot{position:absolute;bottom:28px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:rgba(255,255,255,.5)}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loader">
    <div class="title">THIX ID CENTRAL</div>
    <div class="sub">UNE IDENTITÉ VÉRIFIÉE<div class="sub2">avenir de confiance</div></div>
    <div class="spin"></div>
    <div class="foot">BY SONATHIX GROUP</div>
  </div>
  <script>
    var h=false; function hide(){if(h)return;h=true;var l=document.getElementById('loader');if(l){l.classList.add('hidden');setTimeout(()=>l.remove(),500)}}
    window.addEventListener('flutter-first-frame',hide);
    setTimeout(hide,2500); // FIX écran bleu vide
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
