<!DOCTYPE html>
<html lang="fr">
<head>

  <!-- Flutter remplace automatiquement cette valeur au build -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta
      name="description"
      content="Application officielle THIX ID">

  <!-- Anti cache -->
  <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">

  <meta http-equiv="Pragma"
        content="no-cache">

  <meta http-equiv="Expires"
        content="0">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F7B500">

  <!-- Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="THIX ID">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>THIX ID</title>

  <style>

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#ffffff;
      font-family:Arial,Helvetica,sans-serif;
    }

    #loading{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:#ffffff;
      z-index:999999;
    }

    .loader{
      width:48px;
      height:48px;
      border-radius:50%;
      border:4px solid #E5E5E5;
      border-top:4px solid #F7B500;
      animation:spin .9s linear infinite;
      margin-bottom:18px;
    }

    @keyframes spin{
      from{transform:rotate(0deg);}
      to{transform:rotate(360deg);}
    }

  </style>

</head>

<body>

<div id="loading">
  <div class="loader"></div>
  <div>Chargement sécurisé...</div>
</div>

<!-- Passkeys -->
<script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>

<!-- Flutter -->
<script src="flutter_bootstrap.js" async></script>

<script>

window.addEventListener("flutter-first-frame",function(){

    const loader=document.getElementById("loading");

    if(loader){
        loader.remove();
    }

});

window.addEventListener("pageshow",function(event){

    if(event.persisted){
        window.location.reload();
    }

});

document.addEventListener("visibilitychange",function(){

    if(document.hidden){
        return;
    }

    if(!window.flutter){

        window.location.reload();

    }

});

</script>

</body>
</html>
