<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="THIX ID CENTRAL - Une identité Vérifiée, avenir de confiance">
  <meta name="theme-color" content="#0A1F44">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/Icon-192.png">
  <title>THIX ID CENTRAL</title>
  <style>
    html,body{margin:0;padding:0;height:100%;background:#0A1F44;overflow:hidden}
    flt-glass-pane,flutter-view{ background:#0A1F44 !important; }
    #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A1F44;z-index:99999;transition:opacity .4s ease}
    #loader.hidden{opacity:0;pointer-events:none}
    .title{font-size:32px;font-weight:900;color:#fff;letter-spacing:1px;text-align:center}
    .sub{margin-top:18px;color:#F7C948;font-weight:800;text-transform:uppercase;text-align:center}
    .sub2{color:rgba(255,255,255,.85);font-weight:500;text-transform:none;margin-top:4px;font-size:14px}
    .spin{margin-top:28px;width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#F7C948;border-radius:50%;animation:spin .9s linear infinite}
    .foot{position:absolute;bottom:28px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:rgba(255,255,255,.45)}
    #err{ display:none; margin-top:24px; max-width:320px; background:rgba(255,255,255,.08); padding:12px; border-radius:12px; color:#ff9a9a; font-size:12px; text-align:center; }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loader">
    <div class="title">THIX ID CENTRAL</div>
    <div class="sub">UNE IDENTITÉ VÉRIFIÉE<div class="sub2">avenir de confiance</div></div>
    <div class="spin"></div>
    <div id="err"></div>
    <div class="foot">BY SONATHIX GROUP</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function(){
      var l=document.getElementById('loader');
      if(l){ l.classList.add('hidden'); setTimeout(()=>l.remove(),600); }
    });
    window.addEventListener('error', function(e){
      var errBox=document.getElementById('err');
      if(errBox){ errBox.style.display='block'; errBox.textContent='Erreur: '+e.message; }
      console.error(e);
    });
    // Si après 12s toujours pas de frame, on affiche pourquoi
    setTimeout(function(){
      var l=document.getElementById('loader');
      if(l && !l.classList.contains('hidden')){
        var errBox=document.getElementById('err');
        if(errBox){
          errBox.style.display='block';
          errBox.innerHTML='Chargement bloqué.<br>Vérifie la console (F12) -> main.dart.js ou base-href.';
        }
      }
    },12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
