name: thix_id
description: "THIX ID - Une identité numérique sécurisée"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.1
  fl_chart: ^0.69.0
  iconsax: ^0.0.8
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # State Management - MODERNE
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  provider: ^6.1.2 # temporaire pour AppRouter.create()

  # Backend
  supabase_flutter: ^2.8.0
  dio: ^5.7.0
  http: ^1.2.2

  # Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.4
  collection: ^1.19.1
  json_annotation: ^4.9.0
  equatable: ^2.0.8
  intl: ^0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.3
  path: ^1.9.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  local_auth: ^2.1.6
  encrypt: ^5.0.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  
  # VERSIONS PINS - COMPATIBLES DART 3.6 - PAS DE CONFLIT
  build_runner: 2.4.13
  json_serializable: 6.8.0
  hive_generator: 2.0.1
  riverpod_generator: 2.6.3
  riverpod_lint: 2.3.11
  custom_lint: 0.6.8

dependency_overrides:
  analyzer: 6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
