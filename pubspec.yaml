name: thix_id
description: "THIX ID - Une identité numérique sécurisée"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  go_router: ^14.6.1
  fl_chart: ^0.69.0
  iconsax: ^0.0.8
  carousel_slider: ^4.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.8.4

  # Utils & Storage
  # CORRIGÉ : intl version compatible avec flutter_localizations
  intl: ^0.20.2  # Changé de ^0.19.0 à ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Media & Communication
  video_player: ^2.9.2
  agora_rtc_engine: ^6.5.1
  record: ^5.1.2
  image_picker: ^1.1.2

  # Identification & Scanning
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  nfc_manager: ^4.0.1
  mobile_scanner: ^5.0.1
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # OCR & IA
  google_ml_kit: ^0.16.0

  # Notifications & Sharing
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  share_plus: ^10.1.1

  # Files & PDF
  file_picker: ^8.1.2
  printing: ^5.13.0
  pdf: ^3.10.10

  # Graphiques
  syncfusion_flutter_charts: ^28.1.39

  # Audio / Dictée
  speech_to_text: ^6.6.0

  # Others
  timeago: ^3.6.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3

  # ✅ AJOUTÉ (manquait)
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Correction pour l'icône (si vous utilisez flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
