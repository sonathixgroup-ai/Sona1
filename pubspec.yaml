name: thix_id
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core & Architecture
  provider: ^6.0.5
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.6
  go_router: ^14.0.2
  dio: ^5.4.0
  get: ^4.6.6

  # Supabase & Auth
  supabase_flutter: ^2.0.0
  supabase: ^2.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.1.6

  # Database & JSON
  json_annotation: ^4.8.1
  equatable: ^2.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Images & Files
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0

  # UI & Animations
  flutter_rating_bar: ^4.0.1
  shimmer: ^2.0.0
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.1.2

  # Media & Communication
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  record: ^5.1.2
  agora_rtc_engine: ^6.5.1
  speech_to_text: ^6.6.0

  # Geolocation & Maps
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  google_maps_flutter: ^2.13.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Scanning & NFC
  mobile_scanner: ^5.0.1
  nfc_manager: ^4.0.1
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # Notifications & Sharing
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  share_plus: ^10.1.1
  url_launcher: ^6.3.0

  # PDF & Printing
  printing: ^5.13.0
  pdf: ^3.10.10

  # Charts & Analytics
  syncfusion_flutter_charts: ^28.1.39

  # Security
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.0
  timezone: ^0.9.4
  uuid: ^4.5.3
  debounce_throttle: ^2.0.0
  csv: ^6.0.0
  excel: ^4.0.6
  flutter_contacts: ^1.1.9+2
  google_ml_kit: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.3.10
  hive_generator: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
