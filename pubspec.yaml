name: thix_id
description: "THIX ID - Une identité numérique sécurisée"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  provider: ^6.1.2
  go_router: ^17.0.0
  fl_chart: ^0.68.0
  iconsax: 0.0.8
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend
  supabase_flutter: '>=1.10.0'

  # Utils & Storage
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Media & Communication
  video_player: ^2.10.1
  agora_rtc_engine: ^6.5.4
  record: ^6.2.1
  image_picker: ^1.2.1
  # Note: we use url_launcher to open Jitsi links; no dedicated jitsi_meet plugin required.

  # Identification & Scanning
  geolocator: ^13.0.4
  geocoding: ^3.0.0                 # Conversion adresse
  nfc_manager: ^4.0.2
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.0

  # OCR & IA
  google_ml_kit: ^0.16.0            # Scan ordonnance

  # Notifications & Sharing
  flutter_local_notifications: ^18.0.1
  permission_handler: ^12.0.0
  share_plus: ^10.1.4

  # Files & PDF
  file_picker: ^8.1.2
  printing: ^5.14.3
  pdf: ^3.11.3

  # Graphiques
  syncfusion_flutter_charts: ^31.1.19  # Graphiques avancés

  # Audio / Dictée
  speech_to_text: ^7.0.0             # Dictée vocale médecin

  # Others
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
