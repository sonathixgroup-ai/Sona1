name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # 👉 Génération des modèles JSON avant la compilation
      - name: Generate data models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        # 👉 LA SOLUTION EST ICI : Ajout de --no-tree-shake-icons à la fin de la commande
        run: flutter build web --release --base-href /Sona1/ --no-tree-shake-icons

      # GitHub Pages does not provide SPA rewrite by default.
      # Copy index.html to 404.html so deep links (go_router paths) load the app.
      - name: SPA fallback for go_router
        run: cp build/web/index.html build/web/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
